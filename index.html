<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Under Construction · The Kava Corner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0F2A22;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== HEADER ===== */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      padding: clamp(8px, 1.5vh, 16px) 0;
      background: rgba(253, 248, 244, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }
    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 clamp(16px, 4vw, 48px);
      width: 100%;
    }
    .nav-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: clamp(8px, 2vw, 24px);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: clamp(4px, 1vw, 12px);
      text-decoration: none;
      flex-shrink: 0;
    }
    .logo-icon {
      width: clamp(28px, 4vw, 40px);
      height: clamp(28px, 4vw, 40px);
      flex-shrink: 0;
    }
    .logo-icon svg {
      width: 100%;
      height: 100%;
      fill: #E882B5;
      stroke: #E882B5;
    }
    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.0;
    }
    .logo-text .the {
      font-size: clamp(0.35rem, 0.6vw, 0.5rem);
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.7;
      color: #fff;
    }
    .logo-text .kava {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(1rem, 2.2vw, 1.6rem);
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1;
      background: linear-gradient(135deg, #F5D4E1, #E882B5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-text .corner {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(0.45rem, 0.7vw, 0.65rem);
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(12px, 2.5vw, 32px);
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .nav-links a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      font-size: clamp(0.7rem, 1vw, 0.9rem);
      font-weight: 600;
      transition: 0.2s;
      letter-spacing: 0.3px;
      white-space: nowrap;
      padding: clamp(4px, 0.5vw, 8px) clamp(8px, 1vw, 16px);
      border-radius: 40px;
      border: 2px solid transparent;
    }
    .nav-links a:hover {
      color: #E882B5;
      border-color: #E882B5;
    }

    /* ===== HERO / UNDER CONSTRUCTION ===== */
    .construction-hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(160deg, #0F2A22 0%, #1a4a3a 35%, #4FA392 65%, #E882B5 100%);
      position: relative;
      overflow: hidden;
      padding: clamp(100px, 15vh, 140px) clamp(16px, 4vw, 48px) clamp(40px, 8vh, 80px);
    }
    .construction-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 50%, rgba(232, 130, 181, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, rgba(79, 163, 146, 0.15) 0%, transparent 50%);
      pointer-events: none;
    }

    /* Floating shapes */
    .float-shapes {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: floatShape 20s infinite alternate ease-in-out;
    }
    .shape:nth-child(1) {
      width: 500px;
      height: 500px;
      top: -150px;
      right: -100px;
      background: rgba(232, 130, 181, 0.2);
      animation-duration: 25s;
    }
    .shape:nth-child(2) {
      width: 400px;
      height: 400px;
      bottom: -100px;
      left: -100px;
      background: rgba(79, 163, 146, 0.2);
      animation-duration: 18s;
      animation-delay: 3s;
    }
    .shape:nth-child(3) {
      width: 200px;
      height: 200px;
      top: 30%;
      left: 50%;
      background: rgba(212, 175, 55, 0.15);
      animation-duration: 15s;
      animation-delay: 6s;
    }
    @keyframes floatShape {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -40px) scale(1.1); }
    }

    .construction-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }

    /* Big Under Construction Sign */
    .construction-sign {
      position: relative;
      display: inline-block;
      margin-bottom: clamp(20px, 4vh, 40px);
    }
    .construction-sign .icon {
      font-size: clamp(4rem, 10vw, 8rem);
      display: block;
      margin-bottom: clamp(8px, 1.5vh, 16px);
      animation: bounceIcon 2s ease-in-out infinite;
      color: #D4AF37;
    }
    @keyframes bounceIcon {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(-5deg); }
    }

    .construction-sign h1 {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(3.5rem, 10vw, 8rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: clamp(4px, 1.5vw, 12px);
      background: linear-gradient(135deg, #F5D4E1, #E882B5, #D4AF37, #E882B5);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s ease-in-out infinite;
      line-height: 1.1;
      text-shadow: none;
      position: relative;
    }
    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .construction-sign .sub-text {
      font-size: clamp(1rem, 2vw, 1.8rem);
      color: rgba(255, 255, 255, 0.8);
      font-weight: 300;
      letter-spacing: clamp(4px, 1vw, 8px);
      text-transform: uppercase;
      margin-top: clamp(4px, 1vh, 12px);
      display: block;
      -webkit-text-fill-color: rgba(255, 255, 255, 0.8);
    }

    .construction-divider {
      width: clamp(80px, 15vw, 200px);
      height: 4px;
      background: linear-gradient(90deg, transparent, #E882B5, #D4AF37, #E882B5, transparent);
      margin: clamp(16px, 3vh, 32px) auto;
      border-radius: 10px;
    }

    .construction-message {
      font-size: clamp(1rem, 1.4vw, 1.3rem);
      color: rgba(255, 255, 255, 0.85);
      max-width: 550px;
      margin: 0 auto clamp(20px, 4vh, 40px);
      line-height: 1.7;
      font-weight: 300;
    }

    .construction-message i {
      color: #E882B5;
      margin: 0 4px;
    }

    /* Animated construction bars */
    .progress-bars {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 400px;
      margin: 0 auto;
    }
    .progress-bar {
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar .fill {
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, #E882B5, #D4AF37);
      animation: progressFill 3s ease-in-out infinite alternate;
      width: 0%;
    }
    .progress-bar:nth-child(1) .fill { animation-delay: 0s; }
    .progress-bar:nth-child(2) .fill { animation-delay: 0.5s; }
    .progress-bar:nth-child(3) .fill { animation-delay: 1s; }
    .progress-bar:nth-child(4) .fill { animation-delay: 1.5s; }
    @keyframes progressFill {
      0% { width: 15%; }
      100% { width: 85%; }
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: clamp(0.5rem, 0.6vw, 0.65rem);
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: -4px;
    }

    /* Social links */
    .social-construction {
      margin-top: clamp(24px, 4vh, 48px);
      display: flex;
      gap: clamp(16px, 2vw, 32px);
      justify-content: center;
    }
    .social-construction a {
      color: rgba(255, 255, 255, 0.5);
      font-size: clamp(1.2rem, 1.8vw, 1.8rem);
      transition: 0.3s;
      text-decoration: none;
    }
    .social-construction a:hover {
      color: #E882B5;
      transform: translateY(-4px) scale(1.1);
    }

    /* Responsive */
    @media (max-width: 540px) {
      .construction-sign h1 {
        font-size: 2.8rem;
        letter-spacing: 4px;
      }
      .construction-sign .icon {
        font-size: 3rem;
      }
      .nav-links {
        gap: clamp(4px, 1vw, 8px);
      }
      .nav-links a {
        font-size: 0.6rem;
        padding: 3px 8px;
      }
      .progress-bars {
        max-width: 280px;
      }
    }
  </style>
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header>
    <div class="container nav-wrapper">
      <a href="index.html" class="logo" aria-label="The Kava Corner home">
        <span class="logo-icon">
          <svg viewBox="0 0 100 100">
            <path d="M50 10 L20 40 L30 60 L50 90 L70 60 L80 40 L50 10 Z" fill="none" stroke="#E882B5" stroke-width="4"/>
            <circle cx="50" cy="50" r="8" fill="#E882B5"/>
          </svg>
        </span>
        <span class="logo-text">
          <span class="the">The</span>
          <span class="kava">KAVA</span>
          <span class="corner">Corner</span>
        </span>
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="location.html">Location</a>
        <a href="menu.html">Menu</a>
      </nav>
    </div>
  </header>

  <!-- ===== UNDER CONSTRUCTION HERO ===== -->
  <section class="construction-hero">
    <div class="float-shapes">
      <div class="shape"></div>
      <div class="shape"></div>
      <div class="shape"></div>
    </div>

    <div class="construction-content">
      <div class="construction-sign">
        <span class="icon">🚧</span>
        <h1>Under Construction</h1>
        <span class="sub-text">Coming Soon</span>
      </div>

      <div class="construction-divider"></div>

      <p class="construction-message">
        <i class="fas fa-seedling"></i> We're building something beautiful.
        Our new website is on its way — stay tuned for the launch!
        <i class="fas fa-heart"></i>
      </p>

      <!-- Animated progress bars -->
      <div class="progress-bars">
        <div class="progress-bar"><div class="fill"></div></div>
        <div class="progress-bar"><div class="fill"></div></div>
        <div class="progress-bar"><div class="fill"></div></div>
        <div class="progress-bar"><div class="fill"></div></div>
        <div class="progress-labels">
          <span>Design</span>
          <span>Content</span>
          <span>Development</span>
          <span>Launch</span>
        </div>
      </div>

      <!-- Social Links -->
      <div class="social-construction">
        <a href="https://www.instagram.com/thekavacorner/" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
        <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
        <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
      </div>
    </div>
  </section>
</body>
</html>
